name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd DialApp && xcodegen generate
      - name: Build
        run: cd DialApp && xcodebuild -project DialApp.xcodeproj -scheme DialApp -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package IPA
        run: |
          cd DialApp
          mkdir -p build/Payload
          cp -r build/Build/Products/Release-iphoneos/DialApp.app build/Payload/
          cd build
          zip -r DialApp.ipa Payload
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: DialApp-ipa
          path: DialApp/build/DialApp.ipa
